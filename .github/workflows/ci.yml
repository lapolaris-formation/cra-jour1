name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache des paquets NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurer les dépendances
        run: dotnet restore

      - name: Compiler
        run: dotnet build --no-restore --configuration Release

      - name: Exécuter les tests
        run: >
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=resultats.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publier les résultats de tests
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resultats-tests
          path: ./TestResults
          retention-days: 30

      - name: Publier l'application
        run: >
          dotnet publish src/Jour1.App/Jour1.App.csproj
          --configuration Release
          --output ./publication
          --no-build

      - name: Téléverser les binaires
        uses: actions/upload-artifact@v7
        with:
          name: jour1-app-${{ github.sha }}
          path: ./publication
          retention-days: 90

  secrets-action:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks via l'action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secrets-binaire:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Gitleaks
        run: >
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          | tar -xz gitleaks

      - name: Rechercher des secrets
        run: ./gitleaks detect --source . --redact --verbose
