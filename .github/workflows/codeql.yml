name: Analyse CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-extended

      - name: Compiler
        run: dotnet build src/Jour1.App --configuration Release -p:TreatWarningsAsErrors=false

      - name: Analyser
        uses: github/codeql-action/analyze@v4
